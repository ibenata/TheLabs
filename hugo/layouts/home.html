<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Site.Title }}</title>
</head>

<body>
    <main>
        <h1>{{ .Site.Title }}</h1>

        <p>{{ .Site.Params.description }}</p>

        <h2>Pages detected by Hugo</h2>

        <p>Total regular pages: {{ len .Site.RegularPages }}</p>

        {{ range .Site.RegularPages }}
            <article>
                <h3>{{ .Title }}</h3>
                <p>Section: {{ .Section }}</p>
                <p>URL: {{ .RelPermalink }}</p>
            </article>
        {{ end }}
    </main>
</body>
</html>
